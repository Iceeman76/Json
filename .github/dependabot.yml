version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/"
      - "/Benchmarks"
      - "/Demo"
      - "/Json"
      - "/JsonTests"
      - "/WebApi"
      - "/WebApiTests"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
